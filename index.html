<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6d5dfc">
  <title>人生ロードマップ</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#24243a}
    header{padding:24px 20px 18px;background:linear-gradient(135deg,#6d5dfc,#9b84ff);color:white}
    h1{font-size:22px;margin:0 0 6px}.sub{font-size:13px;opacity:.9}
    main{max-width:680px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(40,36,90,.08)}
    h2{font-size:16px;margin:0 0 12px}.row{display:flex;gap:8px}.row input{flex:1}.add{width:44px;border:0;border-radius:10px;background:#6d5dfc;color:white;font-size:22px}
    input{border:1px solid #ddddea;border-radius:10px;padding:12px;font-size:14px}ul{list:0;padding:0;margin:12px 0 0}li{list-style:none;padding:10px 8px;border-bottom:1px solid #eee}.empty{color:#9292a3;font-size:13px;text-align:center;padding:12px}
  </style>
</head>
<body>
  <header><h1>人生ロードマップ</h1><div class="sub">今の一歩から、未来を描く</div></header>
  <main>
    <section><h2>短期目標を追加</h2><div class="row"><input id="goal" placeholder="例：英語で仕事ができるようになる" aria-label="目標"><button class="add" id="add" aria-label="追加">＋</button></div></section>
    <section><h2>ロードマップ</h2><ul id="list"></ul></section>
  </main>
<script>
const key='life-roadmap-goals';const list=document.querySelector('#list');const input=document.querySelector('#goal');
const load=()=>JSON.parse(localStorage.getItem(key)||'[]');
function render(){const goals=load();list.innerHTML=goals.length?'':'<li class="empty">まだ目標がありません</li>';for(const goal of goals){const li=document.createElement('li');li.textContent='・ '+goal;list.prepend(li)}}
function add(){const goal=input.value.trim();if(!goal)return;const goals=load();goals.push(goal);localStorage.setItem(key,JSON.stringify(goals));input.value='';render()}
document.querySelector('#add').addEventListener('click',add);input.addEventListener('keydown',e=>{if(e.key==='Enter')add()});render();
</script>
</body>
</html>
